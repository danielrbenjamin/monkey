<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monkey Guide</title>
  <link rel="stylesheet" href="guide.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo">
        <img src="icons/icon48.png" width="28" height="28" alt="Monkey" style="border-radius:6px;" />
        <div>
          <h1 class="guide-title" id="guideTitle" contenteditable="true" spellcheck="true">My Guide</h1>
          <p class="guide-meta" id="guideMeta">0 steps · Click a step to edit</p>
        </div>
      </div>
    </div>
    <div class="header-right">
      <button class="btn btn-ghost" id="libraryBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5A2.5 2.5 0 014 17V5a2 2 0 012-2h14v14"/></svg>
        Library
      </button>
      <button class="btn btn-ghost btn-save" id="saveBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2zM17 21v-8H7v8M7 3v5h8"/></svg>
        <span id="saveBtnLabel">Save to Library</span>
      </button>
      <div class="divider"></div>
      <button class="btn btn-ghost" id="addStepBtn" title="Add a manual step">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Add step
      </button>
      <div class="divider"></div>
      <button class="btn btn-ghost" id="copyMdBtn" title="Copy Markdown to clipboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>
        Copy MD
      </button>
      <button class="btn btn-ghost" id="exportMdBtn" title="Download Markdown + images as ZIP">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1M8 12l4 4 4-4M12 16V4"/></svg>
        MD + Images
      </button>
      <button class="btn btn-ghost" id="exportHtmlBtn" title="Export as HTML file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1M8 12l4 4 4-4M12 16V4"/></svg>
        Export HTML
      </button>
      <button class="btn btn-primary" id="printBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg>
        Print / PDF
      </button>
    </div>
  </header>

  <!-- Toolbar (shown when editing) -->
  <div class="edit-toolbar hidden" id="editToolbar">
    <span class="toolbar-hint">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Editing step description — click outside or press Enter to save
    </span>
  </div>

  <!-- Empty state -->
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="1.5">
        <path d="M15 10l-4 4-4-4M12 6v8M12 21a9 9 0 100-18 9 9 0 000 18z"/>
      </svg>
    </div>
    <h2>No steps recorded yet</h2>
    <p>Use the Monkey extension to record your workflow, then come back here to view and edit your guide.</p>
    <button class="btn btn-primary btn-lg" id="openExtBtn">Open Monkey</button>
  </div>

  <!-- Steps list -->
  <main class="main" id="mainContent">
    <div class="steps-list" id="stepsList"></div>
  </main>

  <!-- Step template (cloned via JS) -->
  <template id="stepTemplate">
    <article class="step-card" draggable="true">
      <div class="step-sidebar">
        <div class="step-number">1</div>
        <div class="step-connector"></div>
      </div>
      <div class="step-body">
        <div class="step-meta">
          <span class="step-page-title"></span>
          <span class="step-url"></span>
        </div>
        <div class="step-screenshot-wrap">
          <div class="step-screenshot-container">
            <img class="step-screenshot" alt="Step screenshot" />
            <div class="step-no-screenshot">No screenshot captured</div>
            <!-- Annotation dot injected by JS -->
          </div>
        </div>
        <div class="step-desc-wrap">
          <p class="step-desc" contenteditable="false" spellcheck="true"></p>
        </div>
        <div class="step-controls">
          <button class="ctrl-btn ctrl-up" title="Move up">↑</button>
          <button class="ctrl-btn ctrl-down" title="Move down">↓</button>
          <button class="ctrl-btn ctrl-edit" title="Edit description">✏️</button>
          <button class="ctrl-btn ctrl-delete" title="Delete step">🗑</button>
        </div>
      </div>
    </article>
  </template>

  <!-- Toast -->
  <div class="toast hidden" id="toast"></div>

  <footer class="guide-footer">
    <a href="https://www.flaticon.com/free-icons/monkey" title="monkey icons" target="_blank" rel="noopener">Monkey icons created by Freepik – Flaticon</a>
  </footer>

  <script src="jszip.min.js"></script>
  <script src="guide.js"></script>
</body>
</html>
